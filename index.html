<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>造梦间｜游戏试玩</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #3a1d1c;
    }

    .home {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #3a1d1c url("assets/home-hero.png") center center / cover no-repeat;
    }

    .play-button {
      position: absolute;
      left: 13%;
      top: 65%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
      min-height: 58px;
      padding: 14px 32px;
      border: 1px solid rgba(255, 239, 220, 0.72);
      border-radius: 999px;
      color: #fff8ef;
      background: rgba(83, 37, 35, 0.88);
      box-shadow: 0 8px 24px rgba(20, 7, 7, 0.28), inset 0 0 0 1px rgba(255,255,255,0.08);
      font-size: clamp(17px, 1.7vw, 24px);
      letter-spacing: 0.12em;
      text-decoration: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .play-button::after {
      content: "→";
      margin-left: 14px;
      font-size: 1.15em;
      letter-spacing: 0;
    }

    .play-button:hover,
    .play-button:focus-visible {
      background: rgba(116, 52, 47, 0.96);
      box-shadow: 0 10px 28px rgba(20, 7, 7, 0.36), inset 0 0 0 1px rgba(255,255,255,0.14);
      transform: translateY(-2px);
    }

    .play-button:focus-visible {
      outline: 3px solid rgba(255, 224, 190, 0.82);
      outline-offset: 4px;
    }

    @media (max-width: 700px) {
      .home {
        background-position: 62% center;
      }

      .play-button {
        left: 50%;
        top: auto;
        bottom: 9%;
        min-width: 180px;
        transform: translateX(-50%);
        background: rgba(65, 28, 28, 0.92);
      }

      .play-button:hover,
      .play-button:focus-visible {
        transform: translateX(-50%) translateY(-2px);
      }
    }
  </style>
</head>
<body>
  <main class="home" aria-label="造梦间首页">
    <a class="play-button" href="game01-001/" aria-label="进入游戏试玩">游戏试玩</a>
  </main>
</body>
</html>
